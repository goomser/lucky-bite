<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="leaf" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#7ddc7a"/>
      <stop offset="1" stop-color="#2d8a3b"/>
    </radialGradient>
    <!-- A single leaf: heart pointing to the center (0,0), tip at the stem. -->
    <path id="lf" d="M0 0 C -28 -34 -118 -46 -118 -108 C -118 -152 -64 -168 -40 -132 C -16 -168 38 -152 38 -108 C 38 -46 28 -34 0 0 Z"/>
    <!-- The bite, in icon coordinates: one big round mouthful plus tooth scallops along its rim. -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="392" cy="128" r="74" fill="#000"/>
      <circle cx="326" cy="112" r="15" fill="#000"/>
      <circle cx="322" cy="150" r="14" fill="#000"/>
      <circle cx="338" cy="186" r="14" fill="#000"/>
      <circle cx="372" cy="200" r="14" fill="#000"/>
      <circle cx="408" cy="200" r="13" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="110" fill="#1a0b0e"/>
  <g mask="url(#bite)">
    <g transform="translate(256 250)">
      <path d="M2 30 Q 18 120 40 182" stroke="#2d8a3b" stroke-width="24" stroke-linecap="round" fill="none"/>
      <g fill="url(#leaf)" stroke="#1d6428" stroke-width="7" stroke-linejoin="round">
        <use href="#lf" transform="rotate(-45)"/>
        <use href="#lf" transform="rotate(45)"/>
        <use href="#lf" transform="rotate(135)"/>
        <use href="#lf" transform="rotate(225)"/>
      </g>
      <g fill="#fff" opacity=".16">
        <ellipse cx="-70" cy="-86" rx="24" ry="12" transform="rotate(-42 -70 -86)"/>
        <ellipse cx="-88" cy="64" rx="22" ry="11" transform="rotate(42 -88 64)"/>
        <ellipse cx="70" cy="86" rx="22" ry="11" transform="rotate(-42 70 86)"/>
      </g>
    </g>
  </g>
</svg>
